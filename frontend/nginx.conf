# Старые адреса → новые, 301. Услуги — тот же список, что legacyServiceRedirects в src/data/services.js
map $uri $legacy_redirect {
    default "";
    ~^/services/websites/?$     /services/site-24h;
    ~^/services/web-apps/?$     /services/custom-dev;
    ~^/services/integrations/?$ /services/analytics;
    ~^/services/crm/?$          /services/custom-dev;
    ~^/services/promotion/?$    /services/yandex-direct;
    ~^/services/marketing/?$    /services/marketing-strategy;
    ~^/services/targeting/?$    /services/yandex-direct;
    ~^/pd-panel-x7k2m9/?$       /admin-panel;
}

# Кэш: файлы с хэшем в имени — навсегда, картинки — на месяц, страницы — с проверкой при каждом заходе.
# Ответам бэкенда заголовок не добавляем: у него свои правила.
map $uri $cache_control {
    ~^/assets/                                      "public, max-age=31536000, immutable";
    ~^/(api|uploads)/                               "";
    ~*\.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)$   "public, max-age=2592000";
    ~^/(robots\.txt|sitemap\.xml)$                  "public, max-age=86400";
    default                                         "no-cache";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # перед nginx стоит Caddy: в редиректах только путь, без внутренней схемы и порта
    absolute_redirect off;

    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = '') {
        set $forwarded_proto $scheme;
    }

    # все add_header — здесь: директива внутри location отменила бы заголовки уровня server
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff2;

    if ($legacy_redirect) {
        return 301 $legacy_redirect$is_args$args;
    }

    # страницы собраны заранее (scripts/prerender.mjs); неизвестный адрес — готовая 404 с кодом 404
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # ^~ — префикс важнее правила для картинок ниже: иначе картинки из заявок искались бы среди статики
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = / {
        try_files /index.html =404;
    }

    # админка рисуется в браузере: пустая оболочка с noindex
    location = /admin-panel {
        try_files /spa.html =404;
    }

    location / {
        # у страницы один адрес: /services/ → /services
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
